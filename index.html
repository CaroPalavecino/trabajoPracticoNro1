<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concesionaria - Gestión de Autos</title>
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>Concesionaria de Vehículos</h1>
        <nav>
            <ul>
                <li><a href="#registro">Registrar Auto</a></li>
                <li><a href="#catalogo">Catálogo de Autos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>
       <main>
 <!-- Sección 1: Formulario para ingresar un nuevo auto -->
        <section id="registro">
            <h2>Ingresar Nuevo Auto</h2>
            <form>
                <div>
                    <label for="marca">Marca:</label>
                    <input type="text" id="marca" name="marca" placeholder="Ejemplo: Fiat">
                </div>

                <div>
                    <label for="modelo">Modelo:</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Ejemplo: Cronos">
                </div>

                <div>
                    <label for="anio">Año:</label>
                    <input type="number" id="anio" name="anio" placeholder="Ejemplo: 2023">
                </div>

                <div>
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" name="precio" placeholder="Ejemplo: 15000">
                </div>

                <button type="submit">Guardar Auto</button>
            </form>
        </section>
        <!-- Sección: Filtro y Búsqueda -->
        <section id="filtros">
            <h2>Buscar Vehículo</h2>
            <form id="form-busqueda">
                <div>
                    <label for="buscar-marca">Filtrar por Marca:</label>
                    <input type="text" id="buscar-marca" placeholder="Buscar por marca...">
                </div>
                <div>
                    <label for="buscar-precio">Precio ($):</label>
                    <input type="number" id="buscar-precio" placeholder="Ej: 20000">
                </div>
                <button type="button">Filtrar</button>
            </form>
        </section>
       </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Concesionaria de Autos - Trabajo Práctico N° 1</p>
    </footer>

</body>
</html>
